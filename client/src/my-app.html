<a class="skip-link" href="#main-content" click.trigger="focusMain()">本文へ移動</a>
<header class="site-header">
  <a class="brand" href="#/challenges">EachOther</a>
  <nav aria-label="メインナビゲーション">
    <a href="#/challenges">問題</a><a href="#/answers">正答履歴</a>
    <a href="#/ranking">ランキング</a>
    <template if.bind="session.authenticated"
      ><a href="#/me/answers">自分の解答</a><a href="#/me/challenges">問題管理</a> ><button
        class="secondary"
        click.trigger="logout()"
        disabled.bind="busy"
      >
        ログアウト
      </button></template
    >
    <a else href="#/login">ログイン</a>
  </nav>
</header>
<main id="main-content" tabindex="-1">
  <div if.bind="session.notice" class="notice" role="status">
    ${session.notice}<button
      class="secondary"
      click.trigger="session.notice = ''"
      aria-label="通知を閉じる"
    >
      閉じる
    </button>
  </div>
  <au-viewport fallback="not-found"></au-viewport>
</main>
