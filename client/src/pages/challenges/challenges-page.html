<section class="challenges-page">
  <p class="eyebrow">EXPLORE / SOLVE / LEARN</p>
  <h1>問題に挑戦</h1>
  <p class="muted">気になる問題を選んで、フラグを見つけよう。</p>
  <div class="toolbar">
    <div>
      <label for="search">問題名で検索</label
      ><input id="search" type="search" value.bind="search" placeholder="問題を探す" />
    </div>
    <div>
      <label for="genre">ジャンル</label
      ><select id="genre" value.bind="genre">
        <option value="">すべて</option>
        <option repeat.for="item of genres" model.bind="item">${item}</option>
      </select>
    </div>
    <button class="secondary" click.trigger="refresh()" disabled.bind="pending">更新</button>
  </div>
  <p if.bind="pending" role="status">読み込み中…</p>
  <p if.bind="error" role="alert" class="error">${error}</p>
  <p if.bind="!pending && !error && !filtered.length" class="empty">
    条件に一致する問題はありません。
  </p>
  <div class="cards">
    <article repeat.for="item of filtered" class="panel">
      <span class="badge">${item.genre || 'ジャンル未設定'}</span>
      <h2>
        <a if.bind="item.id !== undefined" href.bind="'#/challenges/' + item.id"
          >${item.name || '名前未設定'}</a
        ><span else>${item.name || '名前未設定'}</span>
      </h2>
      <p class="excerpt">${item.description || '説明はありません。'}</p>
      <a if.bind="item.id !== undefined" href.bind="'#/challenges/' + item.id">問題を開く →</a>
    </article>
  </div>
</section>
