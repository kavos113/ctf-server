<section class="editor-page">
  <a href="#/me/challenges">← 自分の問題</a>
  <h1>${editing ? '問題を編集' : '問題を作成'}</h1>
  <p if.bind="pending" role="status">読み込み中…</p>
  <p if.bind="error" role="alert" class="error">${error}</p>
  <button if.bind="!ready && error" click.trigger="refresh()">再取得</button>
  <template if.bind="ready && allowed"
    ><form class="panel" submit.trigger="save()">
      <fieldset disabled.bind="busy">
        <legend>問題の内容</legend>
        <label for="name">問題名</label><input id="name" value.bind="form.name" required />
        <div
          class="description-tabs"
          role="tablist"
          aria-label="説明"
          keydown.trigger="descriptionTabKeydown($event)"
        >
          <button
            id="description-tab-edit"
            type="button"
            role="tab"
            aria-controls="description-edit"
            aria-selected.bind="descriptionTab === 'edit'"
            tabindex.bind="descriptionTab === 'edit' ? 0 : -1"
            click.trigger="selectDescriptionTab('edit')"
          >
            編集
          </button>
          <button
            id="description-tab-preview"
            type="button"
            role="tab"
            aria-controls="description-preview"
            aria-selected.bind="descriptionTab === 'preview'"
            tabindex.bind="descriptionTab === 'preview' ? 0 : -1"
            click.trigger="selectDescriptionTab('preview')"
          >
            プレビュー
          </button>
        </div>
        <div
          id="description-edit"
          role="tabpanel"
          aria-labelledby="description-tab-edit"
          show.bind="descriptionTab === 'edit'"
        >
          <label for="description">説明</label>
          <textarea
            id="description"
            value.bind="form.description"
            rows="8"
            aria-describedby="description-help"
          ></textarea>
          <p id="description-help" class="muted">Markdown形式で入力できます。</p>
        </div>
        <div
          id="description-preview"
          role="tabpanel"
          aria-labelledby="description-tab-preview"
          tabindex="0"
          show.bind="descriptionTab === 'preview'"
        >
          <div
            if.bind="descriptionTab === 'preview'"
            class="markdown-content description-preview"
            innerhtml.bind="previewHtml"
          ></div>
        </div>
        <label for="genre">ジャンル</label>
        <select id="genre" value.bind="form.genre" required>
          <option model.bind="undefined">選択してください</option>
          <option repeat.for="genre of genres" model.bind="genre">${genre}</option>
        </select>
        <label for="flag">フラグ</label
        ><input id="flag" value.bind="form.flag" autocomplete="off" required />
        <button type="submit" disabled.bind="busy">${busy ? '保存中…' : '保存する'}</button>
      </fieldset>
    </form>
    <section if.bind="editing" class="panel">
      <h2>問題を削除</h2>
      <button
        class="danger"
        if.bind="!confirmDelete"
        click.trigger="confirmDelete = true"
        disabled.bind="busy"
      >
        削除する
      </button>
      <div if.bind="confirmDelete" role="alert">
        <p>「${form.name}」を削除します。この操作は取り消せません。</p>
        <button class="danger" click.trigger="remove()" disabled.bind="busy">削除を確定</button>
        ><button class="secondary" click.trigger="confirmDelete = false" disabled.bind="busy">
          キャンセル
        </button>
      </div>
    </section></template
  >
</section>
