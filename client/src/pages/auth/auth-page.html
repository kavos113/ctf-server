<section class="auth-page panel">
  <h1>${signup ? 'ユーザー登録' : 'ログイン'}</h1>
  <p if.bind="error" role="alert" class="error">${error}</p>
  <form submit.trigger="submit()">
    <label for="username">ユーザー名</label>
    <input
      id="username"
      value.bind="username"
      autocomplete="username"
      minlength="3"
      maxlength="32"
      pattern="[A-Za-z0-9_\-]+"
      aria-describedby="username-help"
      required
      disabled.bind="busy"
    />
    <p id="username-help" class="muted">半角英数字-_で3〜32文字</p>
    <label for="password">パスワード</label>
    <input
      id="password"
      type="password"
      value.bind="password"
      autocomplete.bind="signup ? 'new-password' : 'current-password'"
      aria-describedby="password-help"
      required
      disabled.bind="busy"
    />
    <p id="password-help" class="muted">半角英数字記号8〜128文字</p>
    <button type="submit" disabled.bind="busy">
      ${busy ? '送信中…' : signup ? '登録する' : 'ログイン'}
    </button>
  </form>
  <a href.bind="signup ? '#/login' : '#/signup'">${signup ? 'ログインへ' : '新しく登録する'}</a>
</section>
