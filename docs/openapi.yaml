openapi: 3.0.0
info:
  title: CTF Server API
  version: 1.0.0

paths:
  /login:
    post:
      summary: ログイン
      description: DBへのセッション保存後にJWTを返す。応答にはCache-Control no-storeを付与する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: 内部エラー（空本文）
        "400":
          description: JSONまたは入力制約が不正（空本文）
        "503":
          description: パスワードワーカーが満杯または停止中（空本文）
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string

  /logout:
    post:
      summary: ログアウト
      description: 提示したJWTのセッションだけを失効させる。成功時は空本文。
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: 内部エラー（空本文）
        "200":
          description: OK

  /signup:
    post:
      summary: ユーザー登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "500":
          description: 内部エラー（空本文）
        "400":
          description: JSONまたは入力制約が不正（空本文）
        "503":
          description: パスワードワーカーが満杯または停止中（空本文）
        "409":
          description: ユーザー名が登録済み（空本文）
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, username]
                properties:
                  id:
                    type: string
                  username:
                    type: string

  /challenges:
    get:
      summary: すべての問題（フラグを除く）
      description: CONTEST_START_ATより前はログイン状態によらず403。未設定・空の場合は制限なし。
      responses:
        "403":
          description: コンテスト開始前（空本文、Cache-Control no-store）
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeWithoutFlag"
    post:
      summary: 問題を作成
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallengeRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
    put:
      summary: 問題を更新
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallengeRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "403":
          description: 自分の問題ではない
        "404":
          description: 問題が存在しない
    delete:
      summary: 問題を削除
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: OK
        "403":
          description: 自分の問題ではない
        "404":
          description: 問題が存在しない

  /challenges/me:
    get:
      summary: 自分が作った問題
      description: コンテスト開始前も取得可能。認証済みユーザーの問題だけをフラグ付きで返す。該当なしは空配列。
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: 内部エラー（空本文）
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Challenge"

  /answers:
    get:
      summary: すべての解答(正答のみ)
      parameters:
        - name: challenge_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorrectAnswer"
        "404":
          description: 問題が存在しない
    post:
      summary: 問題に解答
      description: コンテスト終了後も受け付け、正誤を返して履歴に保存する。終了時刻以降の正解は得点に含めない。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "404":
          description: 問題が存在しない

  /answers/me:
    get:
      summary: 自分の解答一覧を取得
      security:
        - bearerAuth: []
      parameters:
        - name: challenge_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Answer"
        "404":
          description: 問題が存在しない

  /users:
    get:
      summary: すべてのユーザー（ランキング含む）
      description: 認証不要。開始時刻による制限なし。正解した異なる問題数×100点（自作問題を含む）。CONTEST_END_AT指定時は回答の保存時刻が終了時刻より前の正解だけを集計する。未回答者は0点。得点降順、同点はユーザーID昇順。ユーザーなしは空配列。
      responses:
        "500":
          description: 内部エラー（空本文）
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 認証失敗・期限切れ・失効済み（空本文）
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: [Bearer]
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      description: JSONをデコードして検証する。重複キーと未知フィールドは拒否する。
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
        password:
          type: string
          format: password
          description: デコード後のUTF-8で8〜128バイト。NULは禁止。

    ChallengeWithoutFlag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        genre:
          type: string
        creator_id:
          type: string

    Challenge:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        flag:
          type: string
        genre:
          type: string
        creator_id:
          type: string

    CreateChallengeRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        flag:
          type: string
        genre:
          type: string

    AnswerRequest:
      type: object
      properties:
        challenge_id:
          type: integer
          format: int64
        answer:
          type: string

    Answer:
      type: object
      properties:
        challenge_id:
          type: integer
          format: int64
        answer:
          type: string
        correct:
          type: boolean
        username:
          type: string
        answered_at:
          type: string
          format: date-time

    CorrectAnswer:
      type: object
      properties:
        challenge_id:
          type: integer
          format: int64
        username:
          type: string
        answered_at:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        score:
          type: integer
          format: int64
          minimum: 0
          description: 現存する正解回答から集計する。CONTEST_END_AT指定時はUTCの保存時刻が終了時刻未満のものに限る。終了時刻ちょうどから対象外。重複正解は加点しない。問題削除に伴い回答が削除された場合は得点も減る。
